[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wellbore-knowledge-graph"
version = "0.1.0"
description = "Advanced GraphRAG system for wellbore engineering, IADC standards, failure modes, and SOPs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Subsurface Engineering AI Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "neo4j>=5.18.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

